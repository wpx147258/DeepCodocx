<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <title>DeepCodocx — day and night</title>
  <!-- Editable light/dark palettes; the host selects the matching symbol. -->
  <defs>
    <symbol id="dox-symbol" viewBox="0 0 72 72">
      <defs>
        <linearGradient id="dox-orbit" gradientUnits="userSpaceOnUse" x1="14" y1="36" x2="60" y2="36">
          <stop offset="0" stop-color="var(--logo-night, #0a284b)"/>
          <stop offset=".42" stop-color="var(--logo-night, #0a284b)"/>
          <stop offset=".76" stop-color="var(--logo-sun, #f5a000)"/>
          <stop offset="1" stop-color="var(--logo-sun, #f5a000)"/>
        </linearGradient>
        <linearGradient id="dox-twilight" gradientUnits="userSpaceOnUse" x1="15" y1="14" x2="15" y2="56">
          <stop offset="0" stop-color="var(--logo-night, #0a284b)"/>
          <stop offset=".45" stop-color="var(--logo-night, #0a284b)"/>
          <stop offset="1" stop-color="var(--logo-dawn, #8aa2bc)"/>
        </linearGradient>
      </defs>
      <path d="M15 14C37 4 59 16 60 36C58 57 37 66 15 56"
            fill="none" stroke="url(#dox-orbit)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M15 56C8 43 8 28 15 14"
            fill="none" stroke="url(#dox-twilight)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="15" cy="14" r="6.5" fill="var(--logo-night, #0a284b)"/>
      <circle cx="15" cy="56" r="6.5" fill="var(--logo-dawn, #8aa2bc)"/>
      <circle cx="60" cy="36" r="5.9" fill="var(--logo-sun, #f5a000)"/>
    </symbol>
    <symbol id="dox-symbol-dark" viewBox="0 0 72 72">
      <defs>
        <linearGradient id="dox-orbit-dark" gradientUnits="userSpaceOnUse" x1="14" y1="36" x2="60" y2="36">
          <stop offset="0" stop-color="var(--logo-night-dark, #a9c3e2)"/>
          <stop offset=".42" stop-color="var(--logo-night-dark, #a9c3e2)"/>
          <stop offset=".76" stop-color="var(--logo-sun-dark, #ffbb45)"/>
          <stop offset="1" stop-color="var(--logo-sun-dark, #ffbb45)"/>
        </linearGradient>
        <linearGradient id="dox-twilight-dark" gradientUnits="userSpaceOnUse" x1="15" y1="14" x2="15" y2="56">
          <stop offset="0" stop-color="var(--logo-night-dark, #a9c3e2)"/>
          <stop offset=".45" stop-color="var(--logo-night-dark, #a9c3e2)"/>
          <stop offset="1" stop-color="var(--logo-dawn-dark, #5e7c9e)"/>
        </linearGradient>
      </defs>
      <path d="M15 14C37 4 59 16 60 36C58 57 37 66 15 56"
            fill="none" stroke="url(#dox-orbit-dark)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M15 56C8 43 8 28 15 14"
            fill="none" stroke="url(#dox-twilight-dark)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="15" cy="14" r="6.5" fill="var(--logo-night-dark, #a9c3e2)"/>
      <circle cx="15" cy="56" r="6.5" fill="var(--logo-dawn-dark, #5e7c9e)"/>
      <circle cx="60" cy="36" r="5.9" fill="var(--logo-sun-dark, #ffbb45)"/>
    </symbol>
  </defs>
  <use href="#dox-symbol"/>
</svg>
