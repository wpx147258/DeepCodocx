# Copy this file to ~/.config/cli-agent/config.toml, or pass it with --config.

default_provider = "deepseek"
default_model = "deepseek-flash[1M]"
permission_mode = "accept-edits"

[providers.deepseek]
kind = "anthropic_compat"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = ["DEEPSEEK_API_KEY"]
default_model = "deepseek-flash[1M]"
context_window = 880000
max_output_tokens = 128000
supports_thinking = true
thinking_by_default = true
supports_images = true
# Emit cache_control breakpoints for the static system prefix and tool schemas.
# Off for third-party endpoints by default; enable only if the host accepts it.
# prompt_caching = true

[thinking]
# Leave enabled unset to use the provider default (DeepSeek: on).
# enabled = false
budget_tokens = 100000  # must be below max_output_tokens

[memory]
# The agent writes memory itself through the Remember tool; there is no
# background extraction loop.
enabled = true

# Optional document libraries shown in the DeepDocx selector. Either data/ or
# paper-bundles/ is accepted. The directory is on the server, not the browser.
[deepdocx]
libraries = []
# libraries = ["/path/to/deep-docs-unified/data"]
# Used until the user chooses another library; that choice is saved across restarts.
# default_library = "/path/to/deep-docs-unified/data"
# With no saved/configured library, a nearby deep-docs-unified/data is discovered.

# Optional generic MCP stdio server. Commands are local configuration; models
# cannot choose executable paths. Unknown tools require normal approval.
# [mcp_servers.notes]
# command = "python"
# args = ["/path/to/notes_server.py"]
# read_tools = ["search", "read"]
# timeout = 30
# [mcp_servers.notes.env]
# NOTES_PATH = "/path/to/notes"
