[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-agent"
version = "0.1.0"
description = "A coding and document agent with local evidence, visual reading, and discoverable MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.52",
    "click>=8.1",
    "rich>=13.7",
    "jsonschema>=4.22",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema>=4.22",
]

[project.scripts]
cli-agent = "dcx.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["dcx"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
